# extract.config.yaml — changelog-live standalone package export
# RFC-0070: @warpgogol/repo-extract
# RFC-0071: Explicit org-specific values (no hardcoded defaults)

projectDir: packages/changelog-live
destName: changelog-live
standalone: true

workspacePrefixes:
  - "@syrokomskyi/"
  - "@warpgogol/"
stripScopes:
  - "@syrokomskyi/"
  - "@warpgogol/"
  - "@wgogol/"
preservePackages: []
packageManager: "pnpm"
ignoreDirs:
  - .output
  - .debug
  - .debug-public
  - .astro
  - spec
  - .agents

extraGitignore:
  - .output
  - .debug
  - .debug-public

postProcess:
  - action: delete
    path: AGENTS.md

git:
  remote: git@github.com:syrokomskyi/changelog-live.git
  autoPush: true

skipSecretScan: true
versionBump: patch
